# Service definitions. Names/descriptions are translated via strings.json /
# translations/*.json (section "services"); the English texts here are the base.

log_execution:
  name: Log a completed chore
  description: "Records that a person completed a task. Returns the new execution_id."
  fields:
    person_id:
      name: "Person"
      description: "Person ID (per_…). Shown as the person_id attribute of the person sensor."
      required: true
      example: per_1a2b3c4d
      selector:
        text:
    task_id:
      name: "Task"
      description: "Task ID (tsk_…). Shown as the task_id attribute of the \"last done\" sensor."
      required: true
      example: tsk_1a2b3c4d
      selector:
        text:
    ts:
      name: "Time"
      description: "Optional. Defaults to now; use it to log something afterwards. Without a time zone, Home Assistant's local time is used."
      required: false
      selector:
        datetime:
    note:
      name: "Note"
      description: "Optional note."
      required: false
      selector:
        text:

delete_execution:
  name: Delete a log entry
  description: "Deletes a logged execution by its ID (admin only)."
  fields:
    execution_id:
      name: "Execution ID"
      description: "ID of the log entry (exe_…), e.g. from the response of log_execution or the hausarbeit_execution_logged event."
      required: true
      example: exe_1a2b3c4d
      selector:
        text:

correct_execution:
  name: Correct a log entry
  description: "Changes person, task, time or note of a logged execution (admin only)."
  fields:
    execution_id:
      name: "Execution ID"
      description: "ID of the log entry (exe_…), e.g. from the response of log_execution or the hausarbeit_execution_logged event."
      required: true
      example: exe_1a2b3c4d
      selector:
        text:
    person_id:
      name: "Person (new)"
      description: "Person ID (per_…). Shown as the person_id attribute of the person sensor."
      required: false
      example: per_1a2b3c4d
      selector:
        text:
    task_id:
      name: "Task (new)"
      description: "Task ID (tsk_…). Shown as the task_id attribute of the \"last done\" sensor."
      required: false
      example: tsk_1a2b3c4d
      selector:
        text:
    ts:
      name: "Time (new)"
      description: "Optional. Defaults to now; use it to log something afterwards. Without a time zone, Home Assistant's local time is used."
      required: false
      selector:
        datetime:
    note:
      name: "Note (new)"
      description: "Optional note."
      required: false
      selector:
        text:

add_task:
  name: Add task
  description: "Creates a new chore and returns its ID (admin only)."
  fields:
    name:
      name: "Name"
      description: "Display name."
      required: true
      selector:
        text:
    icon:
      name: "Icon"
      description: "Material Design icon, e.g. mdi:dishwasher."
      required: false
      example: mdi:dishwasher
      selector:
        icon:
    category:
      name: "Category"
      description: "Optional free-text group."
      required: false
      selector:
        text:
    points:
      name: "Points"
      description: "Weight of the task for points statistics (0–100, default 1)."
      required: false
      selector:
        number:
          min: 0
          max: 100
          step: 0.5
          mode: box
    active:
      name: "Active"
      description: "Inactive tasks are hidden on the claim card."
      required: false
      selector:
        boolean:

update_task:
  name: Update task
  description: "Changes an existing chore; omitted fields stay unchanged (admin only)."
  fields:
    task_id:
      name: "Task"
      description: "Task ID (tsk_…). Shown as the task_id attribute of the \"last done\" sensor."
      required: true
      example: tsk_1a2b3c4d
      selector:
        text:
    name:
      name: "Name"
      description: "Display name."
      required: false
      selector:
        text:
    icon:
      name: "Icon"
      description: "Material Design icon, e.g. mdi:dishwasher."
      required: false
      example: mdi:dishwasher
      selector:
        icon:
    category:
      name: "Category"
      description: "Optional free-text group."
      required: false
      selector:
        text:
    points:
      name: "Points"
      description: "Weight of the task for points statistics (0–100, default 1)."
      required: false
      selector:
        number:
          min: 0
          max: 100
          step: 0.5
          mode: box
    active:
      name: "Active"
      description: "Inactive tasks are hidden on the claim card."
      required: false
      selector:
        boolean:

remove_task:
  name: Remove task
  description: "Deletes a chore and its targets. The log is kept (admin only)."
  fields:
    task_id:
      name: "Task"
      description: "Task ID (tsk_…). Shown as the task_id attribute of the \"last done\" sensor."
      required: true
      example: tsk_1a2b3c4d
      selector:
        text:

add_person:
  name: Add person
  description: "Creates a new person and returns their ID (admin only)."
  fields:
    name:
      name: "Name"
      description: "Display name."
      required: true
      selector:
        text:
    icon:
      name: "Icon"
      description: "Material Design icon, e.g. mdi:dishwasher."
      required: false
      example: mdi:dishwasher
      selector:
        icon:
    color:
      name: "Color"
      description: "Optional CSS color, e.g. #3f51b5. Empty string removes it."
      required: false
      example: "#3f51b5"
      selector:
        text:
    ha_person_entity:
      name: "Home Assistant person"
      description: "Optional link to a person entity."
      required: false
      selector:
        entity:
          domain: person

update_person:
  name: Update person
