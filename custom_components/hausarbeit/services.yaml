remove_person:
  name: Remove person
  description: "Deletes a person and their targets. The log is kept (admin only)."
  fields:
    person_id:
      name: "Person"
      description: "Person ID (per_…). Shown as the person_id attribute of the person sensor."
      required: true
      example: per_1a2b3c4d
      selector:
        text:

set_target:
  name: Set target
  description: "Creates or updates how often a person should do a task per period. Returns the target_id (admin only)."
  fields:
    person_id:
      name: "Person"
      description: "Person ID (per_…). Shown as the person_id attribute of the person sensor."
      required: true
      example: per_1a2b3c4d
      selector:
        text:
    task_id:
      name: "Task"
      description: "Task ID (tsk_…). Shown as the task_id attribute of the \"last done\" sensor."
      required: true
      example: tsk_1a2b3c4d
      selector:
        text:
    period:
      name: "Period"
      description: "day, week or month."
      required: true
      selector:
        select:
          translation_key: period
          options:
            - day
            - week
            - month
    count:
      name: "Target count"
      description: "How often per period (≥ 1)."
      required: true
      selector:
        number:
          min: 1
          max: 1000
          mode: box

remove_target:
  name: Remove target
  description: "Deletes a target (admin only)."
  fields:
    target_id:
      name: "Target ID"
      description: "Target ID (tgt_…). Shown as the target_id attribute of the target sensor."
      required: true
      example: tgt_1a2b3c4d
      selector:
        text:
