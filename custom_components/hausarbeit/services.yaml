  fields:
    person_id:
      name: "Person"
      description: "Person ID (per_…). Shown as the person_id attribute of the person sensor."
      required: true
      example: per_1a2b3c4d
      selector:
        text:
    name:
      name: "Name"
      description: "Display name."
      required: false
      selector:
        text:
    icon:
      name: "Icon"
      description: "Material Design icon, e.g. mdi:dishwasher."
      required: false
      example: mdi:dishwasher
      selector:
        icon:
    color:
      name: "Color"
      description: "Optional CSS color, e.g. #3f51b5. Empty string removes it."
      required: false
