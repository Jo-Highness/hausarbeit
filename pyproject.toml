[tool.ruff]
target-version = "py313"
line-length = 100
src = ["custom_components", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ASYNC", "C4", "RUF"]
# B008: HA selector helpers as defaults; RUF001-003: intentional typography (×, en-dash) in DE/EN/ES UI text.
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true
known-first-party = ["custom_components"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
