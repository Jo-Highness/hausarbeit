name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
categories:
  - title: "🚀 Features"
    labels:
      - "feature"
      - "enhancement"
  - title: "🐛 Fixes"
    labels:
      - "fix"
      - "bug"
  - title: "📝 Documentation"
    labels:
      - "documentation"
      - "docs"
  - title: "👷 CI"
    labels:
      - "ci"
  - title: "🧰 Chore"
    labels:
      - "chore"
      - "refactor"
      - "dependencies"
change-template: "- $TITLE (#$NUMBER) @$AUTHOR"
change-title-escapes: '\<*_&'
version-resolver:
  major:
    labels:
      - "major"
      - "breaking"
  minor:
    labels:
      - "minor"
      - "feature"
      - "enhancement"
  patch:
    labels:
      - "patch"
      - "fix"
      - "bug"
      - "documentation"
      - "docs"
      - "ci"
      - "chore"
      - "refactor"
      - "dependencies"
  default: patch
autolabeler:
  - label: "feature"
    title:
      - '/^feat(\(.+\))?(!)?:/i'
  - label: "fix"
    title:
      - '/^fix(\(.+\))?(!)?:/i'
  - label: "documentation"
    title:
      - '/^docs(\(.+\))?:/i'
  - label: "ci"
    title:
      - '/^ci(\(.+\))?:/i'
  - label: "chore"
    title:
      - '/^chore(\(.+\))?:/i'
      - '/^refactor(\(.+\))?:/i'
      - '/^test(\(.+\))?:/i'
      - '/^perf(\(.+\))?:/i'
  - label: "breaking"
    title:
      - '/^[a-z]+(\(.+\))?!:/i'
template: |
  ## Changes

  $CHANGES
